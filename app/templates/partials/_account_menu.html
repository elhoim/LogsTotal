{# Keep user data in escaped HTML attributes, never in an Alpine expression. #}
<div x-data="accountMenu()" data-email="{{ user.email }}" class="relative min-w-0"
     @click.outside="open = false"
     @focusout="if (!$el.contains($event.relatedTarget)) open = false"
     @keydown.escape="if (open) { open = false; $refs.trigger.focus(); $event.stopPropagation(); }">
  <button id="account-menu-trigger" x-ref="trigger" type="button"
          @click="open = !open" :aria-expanded="open" aria-expanded="false"
          aria-controls="account-menu" :aria-label="'Account: ' + email"
          :title="email" class="lt-btn lt-btn--ghost lt-btn--nav">
    <span x-text="email" class="truncate max-w-[200px]">{{ user.email }}</span>
    <svg class="w-3 h-3 shrink-0 transition-transform" :class="open && 'rotate-180'"
         viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="m5 7.5 5 5 5-5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div id="account-menu" x-show="open" x-cloak x-transition.opacity
       class="lt-menu absolute right-0 top-full mt-2 w-64">
    <div class="px-3 py-2 border-b border-gray-800 mb-1">
      <p class="text-xs text-gray-500">Signed in as</p>
      <p x-text="email" class="text-sm text-gray-200 break-all mt-1">{{ user.email }}</p>
    </div>
    <button type="button" @click="edit('email')"
            class="flex items-center gap-2.5 w-full text-left px-3 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition">
      <svg class="w-4 h-4 text-gray-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke-width="1.5"/>
        <path d="m3 6 9 7 9-7" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      Change email
    </button>
    <button type="button" @click="edit('password')"
            class="flex items-center gap-2.5 w-full text-left px-3 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition">
      <svg class="w-4 h-4 text-gray-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <rect x="5" y="10" width="14" height="11" rx="2" stroke-width="1.5"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Change password
    </button>
    <form method="POST" action="/auth/cookie/logout" class="mt-1 pt-1 border-t border-gray-800"
          hx-post="/auth/cookie/logout"
          hx-on::after-request="if (event.detail.successful) window.location.href='/'">
      <button type="submit"
              class="flex items-center gap-2.5 w-full text-left px-3 py-2 text-sm text-gray-400 hover:bg-gray-800 hover:text-red-400 transition">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M9 5H5v14h4m5-12 5 5-5 5m-5-5h10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Logout
      </button>
    </form>
  </div>

  <dialog id="account-dialog" x-ref="dialog" aria-labelledby="account-dialog-title"
          aria-describedby="account-dialog-description"
          @cancel.prevent="closeDialog()" @close="dialogClosed()"
          class="w-full max-w-md rounded-xl border border-gray-800 bg-gray-900 text-gray-100 p-0 backdrop:bg-black/70">
    <div class="p-6">
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <p class="text-xs text-gray-500 mb-1">Your account</p>
          <h2 id="account-dialog-title" class="text-lg font-semibold"
              x-text="success ? (mode === 'email' ? 'Email updated' : 'Password changed') : (mode === 'email' ? 'Change email' : 'Change password')"></h2>
        </div>
        <button type="button" @click="closeDialog()" :disabled="busy" aria-label="Close account settings"
                class="lt-btn lt-btn--ghost lt-btn--nav">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="m6 6 12 12M6 18 18 6" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <p id="account-dialog-description" role="status" class="text-sm text-gray-400 mt-2" x-text="description()"></p>

      <p x-ref="error" x-show="error" x-cloak x-text="error" role="alert" tabindex="-1"
         class="mt-4 rounded-lg border border-red-800 bg-red-950/50 px-3 py-2 text-sm text-red-300"></p>

      <form x-ref="form" @submit.prevent="save()" x-show="!success && !needsLogin"
            method="post" action="/api/users/me" :aria-busy="busy" class="mt-5">
        {# Helps password managers associate both password fields with this account. #}
        <input type="text" name="username" autocomplete="username" :value="email"
               class="hidden" readonly tabindex="-1" aria-hidden="true">
        <fieldset :disabled="busy" class="space-y-4">
          <template x-if="mode === 'email'">
            <div>
              <label for="account-email" class="lt-label">New email address</label>
              <input id="account-email" name="email" type="email" required autocomplete="email"
                     spellcheck="false" autocapitalize="none" class="lt-field lt-field--lg w-full">
            </div>
          </template>
          <div>
            <label for="account-current-password" class="lt-label">Current password</label>
            <input id="account-current-password" name="current_password" type="password" required
                   autocomplete="current-password" class="lt-field lt-field--lg w-full">
          </div>
          <template x-if="mode === 'password'">
            <div class="space-y-4">
              <div>
                <label for="account-new-password" class="lt-label">New password</label>
                <input id="account-new-password" name="password" type="password" required minlength="8"
                       autocomplete="new-password" aria-describedby="account-password-help"
                       class="lt-field lt-field--lg w-full">
                <p id="account-password-help" class="text-xs text-gray-500 mt-1.5">At least 8 characters. Avoid common passwords and your email address.</p>
              </div>
              <div>
                <label for="account-confirm-password" class="lt-label">Confirm new password</label>
                <input id="account-confirm-password" name="confirm_password" type="password" required minlength="8"
                       autocomplete="new-password" class="lt-field lt-field--lg w-full">
              </div>
            </div>
          </template>
          <div class="flex justify-end gap-2 pt-4 border-t border-gray-800">
            <button type="button" @click="closeDialog()" class="lt-btn lt-btn--lg">Cancel</button>
            <button type="submit" class="lt-btn lt-btn--lg lt-btn--primary"
                    x-text="busy ? 'Saving…' : (mode === 'email' ? 'Save email' : 'Change password')"></button>
          </div>
        </fieldset>
      </form>
      <div x-show="success || needsLogin" x-cloak role="status" class="mt-5">
        <p x-show="success && mode === 'email'" class="text-sm text-gray-300 break-all">
          Your sign-in email is now <strong x-text="email" class="font-medium text-gray-100"></strong>.
        </p>
        <div class="flex justify-end pt-5">
          <button x-ref="done" type="button" @click="closeDialog()" class="lt-btn lt-btn--lg lt-btn--primary"
                  x-text="needsLogin ? 'Sign in again' : 'Done'"></button>
        </div>
      </div>
    </div>
  </dialog>
</div>
