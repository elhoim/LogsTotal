name: "Windows Full Analysis"
description: "Full analysis of Windows system logs — auto-selects binaries for the host architecture"
is_default: true
log_types:
  - evtx
  - json_evtx
  - json_winlogbeat

tasks:
  - tool: hayabusa
    profile: default
    timeout: 300
    threads: 2
  - tool: chainsaw
    profile: default
    timeout: 300
    threads: 2
    # The profile names SigmaHQ curated rule directories individually.
    # Override rules_path to add rules-dfir/ or rules-compliance/ explicitly.
  - tool: zircolite
    profile: windows
    timeout: 300
  - tool: rsigma
    profile: default
    timeout: 300
